name: CodeQL

# Static analysis (SAST) via GitHub CodeQL. Satisfies the OpenSSF Scorecard
# "SAST" check and surfaces issues as Code Scanning alerts in the Security tab.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "40 5 * * 1"   # Monday 05:40 UTC, just after the Scorecard run

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          languages: python
          queries: security-and-quality
          # SAST targets shipped code only. tests/ and examples/ carry their own
          # idioms (asserts with side-effects, a regex that scans our own HTML in
          # a syntax-check test) that are not production vulnerabilities and
          # shouldn't gate PRs -- scope the analysis to the package.
          config: |
            paths:
              - src
            query-filters:
              # `py/unused-global-variable` is intraprocedural: it flags the module
              # cache idiom, where a function assigns a global and the *next* call
              # reads it (chatcrypto's Fernet pair, db's engine and metadata,
              # redaction's environment matcher). Rewriting those to satisfy the
              # check would trade a documented atomicity invariant for a tool's
              # convenience. Genuinely dead module-level names are covered instead
              # by vulture and by ruff's unused-import and unused-local rules.
              - exclude:
                  id: py/unused-global-variable
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          category: "/language:python"
